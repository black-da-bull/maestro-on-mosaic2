  warning_about_misreading_this_workspace: |
    RTFA / SEC / SDG / SLR documents LOOK like locked canon because
    they have authoritative voice and clean structure. They are
    NOT all locked. Each contains explicit "OPERATOR DECISION
    REQUIRED" markers, "NEEDS SOURCE" markers, and "CANDIDATE"
