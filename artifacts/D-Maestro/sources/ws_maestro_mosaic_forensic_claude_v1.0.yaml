  recommended_next_slice_from_this_workspace_perspective: |
    classifier-routing.

    Reason: INV-17 four turn modes are defined in maestro.md;
    skill:classify.turn is bypass-prohibited in skills.md; G4 is
    specified as governance module. The remaining work is a
