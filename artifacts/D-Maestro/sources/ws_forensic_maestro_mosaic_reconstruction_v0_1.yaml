technical_ust_handling_law_for_day_2:
  prefilled_null_semantics:
    null_means: "reserved address requiring action"
    null_does_not_mean:
      - "field absent"
      - "safe to skip"
      - "low priority by default"
      - "unknown until someone notices"
  address_handling:
    required_granularity: "axis.key.subkey at minimum"
    downstream_rule: >
      Upper-level choices constrain lower-level and downstream choices. A fill is
      not local text; it is a defended decision that other workers must be able
      to calibrate against.
  truncation_law:
    rule: "Truncating Technical UST is structural damage, not harmless shortening."
    failure_effects:
      - "drops symbol-table slots"
      - "causes downstream generic inference"
      - "makes worker completion unverifiable"
      - "corrupts Creative UST projection"
  lockdown_law:
    rule: >
      Technical UST lock-down is not a formality. It is where defended choices
      are exposed to cross-domain pressure before downstream projection.
    unresolved_items:
      - "lock-down meeting composition"
      - "minimum defense evidence"
      - "reopen criteria"
      - "operator override protocol"

creative_ust_projection_law_for_day_2:
  status: "downstream_derivative_shell"
  may_do:
    - "compress high-leverage Technical UST information"
    - "produce Suno-facing lyrics-prompt output"
    - "preserve nuance under parser and character constraints"
    - "encode final approved performance/mix/arrangement cues"
  may_not_do:
    - "invent upstream canon"
    - "replace Technical UST"
    - "silently resolve nulls"
    - "carry unapproved worker decisions"
    - "flatten unresolved contradictions for prompt cleanliness"
  projection_gate:
    required_before_projection:
      - "Technical UST assigned area handled"
      - "SEM admissibility result available"
      - "lyrics-lock status clear"
      - "open nulls justified or routed"
      - "parser-hostile constructs removed lawfully"
      - "no false completion"

sem_day_2_law:
  status: "concurrent_quality_substrate"
  minimum_runtime_functions:
    - "evaluate each proposed UST fill before acceptance"
    - "surface skipped subkeys"
    - "detect truncation"
    - "detect contradiction with locked law"
    - "detect parser-hostile downstream projection"
    - "produce G-Card or gate result"
    - "record quality risks and next action"
  unresolved_relationships:
    - "SEM versus SE20"
    - "SEM versus BICDM-20"
    - "SEM versus Q1-Q16"
    - "SEM versus G-Card scalar"
  day_2_rule: >
    Use SEM as admissibility language immediately, but do not finalize metric
    lineage or scoring normalization until the relationship docket is resolved.

