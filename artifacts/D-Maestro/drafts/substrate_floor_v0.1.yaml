transcript_ingest_protocol_operational_form:
  speaker_turn_parsing: "parse user and assistant turns; preserve order and response dependency"
  prompt_response_boundary_identification: "identify exact user prompt that caused each assistant transformation"
  workflow_evolution_tracking:
    state_form: "ordered lineage log of added rules, reversals, failures, and promoted canon"
    update_protocol: "append not overwrite; supersession links to prior state"
  reversal_correction_supersession_detection: "detect negation, correction, actually/not that/no signals; retroactively scope replacement"
  canon_vs_exploration_separation:
    classification_protocol:
      CANONICAL: "operator asserts rule or architecture"
      TANGENT: "operator explores speculative direction"
      PROBE: "operator tests system behavior"
      CORRECTION: "operator supersedes prior state"
  dependency_chain_preservation: "record which rule depends on which prior artifact or decision"
  procedural_detail_preservation: "preserve steps, order, conditions, and failure routing"
  speculative_logic_flagging: "mark inferred claims as speculative unless operator-promoted"
  architecture_over_prose_prioritization: "extract executable structures before narrative tone"
  failure_mode_classification:
    - summarization_drift
    - truncation_drift
    - placeholder_compression
    - appendage_without_reconciliation
    - canon_exploration_flattening
    - dependency_loss
    - auditability_loss
  reusable_rule_extraction: "convert repeated procedural patterns into named primitives"
  patchable_delta_production: "emit delta as proposed patch not silently folded canon"

validation_system_operational_form:
  val_checks:
    structure_integrity: "required containers and lyric sections present"
    section_order: "metacontainers precede Road-Map and lyrics"
    persona_grammar: "persona IDs match strict regex"
    road_map_safety: "Road-Map contains sequence only"
    syllable_compliance: "quoted lyric lines target 6-11 syllables"
    sfx_placement: "SFX bold token follows lyric and adlib"
    no_comma_enforcement_outside_lyric_quotes: "scan all non-quoted text for commas"
  quinn_checks:
    low_sub_separation: "kick and sub-bass must not occupy unmanaged same frequency role"
