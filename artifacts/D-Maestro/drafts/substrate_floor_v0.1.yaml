      - persona:council.rapcouncil.battle_technician
      - persona:council.rapcouncil.cultural_critic
      - persona:council.strategist.v1
    progression_gate: "consensus gaps are identified or draft passes"

  technical_audit:
    inputs:
      - lyric_draft
      - production_tags
      - Blueprint_JSON
    outputs:
      - VAL_Report
      - QUINN_Report
    invariants:
      - "format compliance and sonic feasibility are distinct"
    authorized_personas:
      - persona:OS.core.architect.v1
      - persona:council.mixmaster_ghost.v1
    progression_gate: "blocking VAL failures resolved or routed"

  revision_and_human_struggle_injection:
    inputs:
      - revision_targets
      - HSI_fragments
      - operator_lines
    outputs:
      - patched_lyrics
      - HSI_log
    invariants:
      - "micro-patch only"
      - "operator lines are ceiling, not floor"
      - "do not overwrite stronger human truth"
    authorized_personas:
      - persona:creative.reformed_architect.v1
      - persona:agent.lyricforge.v1
    progression_gate: "causal chain Origin → Scar → Choice → Cost holds where invoked"

  ai_arranger_vx4_assembly:
    inputs:
      - patched_lyrics
      - Blueprint_JSON
      - section_sequence
    outputs:
      - tempo_map
      - roadmap_events
      - bar_structure
    invariants:
      - "AI_Arranger owns timing"
      - "Road-Map sequence only"
    authorized_personas:
      - persona:agent.arranger.vx4
    progression_gate: "temporal drift removed"

  suno_v4_5_strict_container:
    inputs:
      - Blueprint_JSON
      - patched_lyrics
      - arrangement
    outputs:
      - Suno_Strict_Container
    invariants:
      - "no commas outside lyric quotes"
      - "required metacontainers present"
      - "lyric line order enforced"
    authorized_personas:
      - persona:OS.core.architect.v1
      - persona:agent.arranger.vx4
    progression_gate: "VAL container checks pass or exceptions logged"

  hpa_validation:
    inputs:
      - generated_or_simulated_output
      - Suno_Strict_Container
      - Blueprint_JSON
    outputs:
      - HPA_Report
      - keeper_decision
    invariants:
      - "human authenticity overrides sterile optimization"
    authorized_personas:
      - persona:operator.djmomoney.v1
      - persona:council.mixmaster_ghost.v1
      - persona:council.strategist.v1
    progression_gate: "keep, revise, or reject decision logged"

  cross_domain_iteration:
    inputs:
      - HPA_Report
      - VAL_Report
      - QUINN_Report
      - rollout_constraints
    outputs:
      - reblueprint_order
      - reprompt_order
      - regenerate_order
    invariants:
      - "loop to earliest relevant phase"
      - "max targeted patching"
    authorized_personas:
      - persona:OS.core.architect.v1
      - persona:council.strategist.v1
    progression_gate: "conflict routing determined"

  ip_packaging:
    inputs:
      - final_blueprint
      - final_container
      - validation_reports
      - session_ledger
    outputs:
      - IP_Dossier
      - metadata_package
    invariants:
      - "rights and revenue wiring cannot be implied"
    authorized_personas:
