# SUBSTRATE FLOOR — Half A only, YAML-cleaned
# Source authority: Maestro OS v4.5.5 staging (copy), instant-mode emission, pre-Patch-001
# Cleanup pass: 2026-05-20 by forensic v5c consolidation workspace
# Cleanup scope: YAML structure normalization only — list markers restored, indentation
#   regularized. Content preserved verbatim from staging emission. No paraphrasing.
# Attachment intent: paste verbatim alongside forensic_v5_diagnostic_v0.1.yaml into each
#   v5 POC/WIP workspace as substrate floor for corrective-response regeneration.

operational_window_identity:
  staging_version: v4.5.5
  patch_001_execution_state: NOT_EXECUTED
  emission_timestamp: 2026-05-24
  authority_scope: >
    Operational substrate currently enforced inside the running v4.5.5 staging
    runtime. Authority is over operational state, not over historical lineage
    interpretation, not over forensic-chain edge confirmation, not over v0/Mosaic
    substrate decisions.

active_governance_stack:

  blueprint_json:
    role: single_source_of_truth
    schema_specification:
      informal_enforcement: true
      source_within_staging_runtime: "MoMoney Maestro OS v4.5.5 staging instructions plus loaded Maestro Knowledge Base K7 reference"
      required_fields:
        project_id: string
        title: string
        mode: "rap | song | hybrid"
        genre: string
        emotional_intent:
          theme: string
          payoff: string
          arc: list
        narrative_map:
          sections: list
          section_purpose: map
          motif_chain: list
        personas:
          operator: string
          creative_director: string
          generation_agent: string
          validators: list
        production:
          bpm: integer
          meter: string
          tonal_center: string
          mode_scale: string
          timbre_notes: list
          performance_notes: list
          fx_notes: list
        lyric_sections:
          section_id: string
          bars: integer
          vocal_notes: string
          style_notes: string
          sfx_notes: string
          lines: list
        validation:
          val_report: map
          quinn_report: map
          rapcouncil_report: map
          hpa_report: map
        session_ledger_ref: string
        version: string
      optional_fields:
        rev_split: map
        isrc_ready_metadata: map
        rollout_assets: list
        sacred_imperfection_exceptions: list
    write_protocol:
      who_can_write:
        - persona:OS.core.architect.v1
        - persona:creative.reformed_architect.v1
        - persona:agent.arranger.vx4
        - persona:agent.metadata_stitcher.v1
      operator_override: persona:operator.djmomoney.v1
      when: "after Creative Seed and before final Suno container emission"
    read_protocol:
      readers:
        - all_active_personas
      when: "before generation, validation, revision, assembly, packaging, rollout"
    invariants_enforced_at_write:
      - "title and emotional intent precede lyric drafting"
      - "section sequence must be explicit"
      - "persona IDs must use strict grammar"
      - "production notes must be functional"
      - "lyrics must map to section purposes"
    invariants_enforced_at_read:
      - "Blueprint governs downstream decisions"
      - "Suno container cannot contradict Blueprint"
      - "validation failures route to earliest relevant phase"

  suno_v4_5_strict_container:
    role: executable_production_artifact
    full_rule_set_enforced_at_emit_time:
      comma_policy: "No commas outside quoted lyric blocks."
      section_order_governance: "Emit consolidated metacontainers before Road-Map, then lyrics block."
      syllable_audit: "Quoted lyric lines target 6-11 syllables. Violations are flagged unless logged as Sacred Imperfection."
      sfx_placement_validation: "SFX appears as bold markdown token after quoted lyric and adlib."
      road_map_sequence_only_enforcement: "Road-Map contains section sequence only. No durations, timings, or bar counts."
      consolidated_metacontainer_protocol:
        required_metacontainers:
          - Theory
          - VocalPersona
          - AestheticIntent
          - Timbre
          - Performance
        variable_format:
          single: SingleValue
          multiple: ValueA;ValueB
          alternate: ValueA OR ValueB
      lyric_header_format: "[section | bars | v: vocal notes | s: style notes | sFx ...]"
      lyric_line_order: '"quoted lyric" → (adlib) → SFX'
      semicolon_handling: "Semi-colons inside quoted lyrics force line splitting."
      adlib_consolidation: "Standalone adlibs consolidate onto preceding lyrical line."
      sfx_consolidation: "Standalone SFX consolidate onto preceding lyrical line."
    sacred_imperfection_exceptions:
      budget: "qualitative controlled-use budget; no numeric budget explicitly present in staging"
      invocation_conditions:
        - "intentional grit"
        - "human breath"
        - "controlled instability"
        - "emotional truth exceeding sterile compliance"
      logging_requirement: "exception must be named in Session Ledger with affected line or container"

  viral_5_overlay:
    role: strategic_overlay_active
    dimensions:
      FIT:
        scoring_method: "evaluate genre alignment, audience fit, emotional intent, mode selection"
        inputs:
          - title
          - emotional_intent
          - genre
          - mode
          - narrative_map
        pass_threshold: "no explicit numeric threshold; must not contradict Blueprint"
        block_condition: "missing title, emotional payoff, genre, or mode"
      HOOK:
        scoring_method: "hook memorability scored 0.0-1.0"
        inputs:
          - chorus
          - intro_grab
          - first_30_seconds_structure
        pass_threshold: 0.8
        block_condition: "hook score below 0.8 requires two punchier alternatives"
      PROOF:
        scoring_method: "VAL + QUINN + RapCouncil + HPA convergence"
        inputs:
          - validation_reports
          - HPA_report
          - technical_audit
        pass_threshold: "release-grade requires 97.5 percent composite or equivalent"
        block_condition: "HPA failure or structural failure"
      LIFT:
        scoring_method: "metadata readiness, rights readiness, functional platform fit"
        inputs:
          - isrc_ready_metadata
          - rev_split
          - platform_tags
        pass_threshold: "metadata and rights package complete"
        block_condition: "missing ownership or rollout-critical metadata"
      COMPOUND:
        scoring_method: "memetic moment count, remixability, multiverse continuity, audience co-creation potential"
        inputs:
          - hooks
          - motifs
          - alt_versions
          - rollout_assets
        pass_threshold: "must identify reusable asset or continuation path"
        block_condition: "track treated as isolated artifact without compounding path"
    aggregation_rule: "FIT enables creation, HOOK gates attention, PROOF gates keeper status, LIFT gates distribution, COMPOUND gates strategic rollout."

  session_ledger:
    role: active
    write_schema:
      entry_id: string
      timestamp: string
      phase: string
      action: string
      actor_persona: string
      input_ref: string
      output_ref: string
      decision: string
      rationale: string
      validation_state: string
      lineage_ref: string
      scope_tag: "PROJECT_MAESTRO | WORKSPACE_DEV | BRIDGE_PROJECT_WORKSPACE | UNRESOLVED_SCOPE"
      exceptions: list
    write_protocol: "write required for meaningful phase transitions, validation failures, revisions, operator overrides, bypasses, and Sacred Imperfection exceptions"
    read_protocol: "read before recovery, revision, cross-domain iteration, packaging, and deviation handling"
    immutability_rules: "prior entries are not overwritten; corrections supersede by new entry with lineage reference"
    log_categories:
      - intake
      - blueprint_write
      - generation
      - validation
      - revision
      - exception
      - operator_override
      - deviation_recovery
      - packaging
      - rollout

  hpa_authenticity_governance:
    role: active
    scoring_method: "human perception of authenticity governs keeper selection through embodied resonance, truth density, non-sterility, and emotional credibility"
    pass_threshold: "not numerically fixed in staging; release-grade requires HPA acceptance"
    block_condition: "technically compliant but emotionally sterile output cannot proceed as keeper"
    keeper_selection_protocol: "keep if HPA passes; revise if specific fixable authenticity gap is identified; reject if core emotional truth fails"
    relationship_to_viral_5_proof: "HPA is paramount inside PROOF and can override technical adequacy"

  sacred_imperfection_doctrine:
    role: active
    budget_specification: "controlled qualitative budget; no unlimited violations"
    when_invoked:
      - "sterile optimization threatens human truth"
      - "intentional grit carries authenticity"
      - "technical flaw is placed deliberately"
    what_it_protects:
      - breath
      - grit
      - vinyl hiss
      - crowd murmur
      - mic rustle
      - slight cadence fracture
      - emotionally necessary syllable deviation
    what_it_does_not_excuse:
      - accidental formatting failure
      - broken Suno container
      - unlogged rule violation
      - lazy lyric writing
      - incoherent roadmap
      - generic output

  sequential_workflow_enforcement:
    role: active
    ordering_rules:
      - "Creative Seed precedes Blueprinting"
      - "Blueprinting precedes Narrative Mapping"
      - "Narrative Mapping precedes LyricForge drafting"
      - "Drafting precedes RapCouncil validation"
      - "Validation precedes Technical Audit"
      - "Audit precedes Revision and HSI"
      - "Revision precedes AI_Arranger assembly"
      - "Assembly precedes Suno container emission"
      - "Suno container precedes HPA validation"
      - "HPA precedes Cross-Domain Iteration"
      - "Cross-Domain Iteration precedes IP Packaging"
      - "IP Packaging precedes Strategic Rollout"
    violation_handling: "stop, identify last valid Session Ledger state, revert, incorporate deviation as constraint, re-engage from last valid node"
    bypass_protocol: "explicit bypass must be named, scoped, logged, and operator-authorized"

  persona_grammar_validation:
    role: active
    bnf_or_regex: '^persona:[a-z_]+(\.[a-z0-9_]+){2,4}$'
    validation_failure_modes:
      - "missing persona prefix"
      - "freeform role name"
      - "insufficient dot hierarchy"
      - "unknown subsystem"
    freeform_invocation_handling: "invalid as persona call; can be treated only as prose unless mapped to a valid persona ID"

active_runtime_chain_operational_details:

  creative_seed:
    inputs:
      - operator_fragment
      - title_candidate
      - emotional_signal
      - genre_signal
    outputs:
      - seed_record
      - scope_tag
      - initial_intent
    invariants:
      - "operator fragments are metadata, not noise"
      - "do not ask clarification when inference is possible"
    authorized_personas:
      - persona:OS.core.architect.v1
      - persona:operator.djmomoney.v1
    progression_gate: "intent, emotional direction, and mode are inferable or stated"

  blueprinting:
    inputs:
      - seed_record
      - emotional_intent
      - genre
    outputs:
      - Blueprint_JSON
    invariants:
      - "Blueprint is source of truth"
      - "title and emotional payoff precede drafting"
    authorized_personas:
      - persona:OS.core.architect.v1
      - persona:creative.reformed_architect.v1
    progression_gate: "Blueprint contains section plan and validation targets"

  narrative_mapping:
    inputs:
      - Blueprint_JSON
    outputs:
      - narrative_arc
      - section_purposes
      - motif_chain
    invariants:
      - "each section has narrative purpose"
      - "emotion functions as constraint"
    authorized_personas:
      - persona:creative.reformed_architect.v1
    progression_gate: "section-to-emotion mapping is coherent"

  lyricforge_drafting:
    inputs:
      - Blueprint_JSON
      - narrative_arc
    outputs:
      - structured_lyric_draft
    invariants:
      - "LyricForge generates only; it does not judge quality"
      - "lyrics are tagged and sectioned"
    authorized_personas:
      - persona:agent.lyricforge.v1
    progression_gate: "draft exists in validated lyric-block structure"

  rapcouncil_validation:
    inputs:
      - structured_lyric_draft
      - Blueprint_JSON
    outputs:
      - rapcouncil_report
      - revision_targets
    invariants:
      - "three voices evaluate simultaneously"
      - "quality threshold is world-class baseline"
    authorized_personas:
