    progression_gate: "metadata and rev_split mapped or explicitly null"

  strategic_rollout:
    inputs:
      - IP_Dossier
      - memetic_moments
      - platform_assets
    outputs:
      - rollout_plan
      - compound_asset_plan
    invariants:
      - "track is fragment of Unhinged Multiverse"
      - "compound path required"
    authorized_personas:
      - persona:council.strategist.v1
      - persona:agent.visionary_chronicler.v1
    progression_gate: "platform strategy and audience co-creation path defined"

