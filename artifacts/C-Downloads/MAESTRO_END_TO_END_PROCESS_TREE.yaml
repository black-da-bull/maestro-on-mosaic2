      - lyric_edits_allowed_only_where_lyric_music_creation_process_allows_or_human_approval_required
      - preserve_lineage
    provenance: SOURCE_BACKED

  M9_format_and_policy_validator:
    purpose: enforce_Suno_efficient_formatting_and_policy
    validators:
      - no_commas_outside_lyric_quotes_except_allowed_pattern
      - fail_stage_direction_markup_inside_quoted_lines
      - enforce_performer_token_header_alignment
      - roadmap_order_only
      - syllable_guideline
    provenance: SOURCE_BACKED

  M10_show_summary_generator:
    purpose: generate_compact_professional_narrative_overview
