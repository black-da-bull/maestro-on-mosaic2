governance_edges:
  sidechain_protocol:
    status: provisional_complete
    definition: non_canonical_pressure_edge
    attaches_to:
      - Technical_UST_address
      - worker_verdict
      - Song_Excellence_criterion
      - round_robin_entry
      - gate_readiness
      - reverse_processing_guard
      - surface_derivation_guard
    cannot_replace: canon
    completion_if_any_false: PARTIAL
    provenance: SOURCE_BACKED

  slipstream_protocol:
    definition: provisional_active_working_current
    lifecycle_states:
      - proposed
      - active_slipstream
      - converted_to_sidechain
      - promoted_to_canon
      - forked
      - superseded
      - rejected
    canon_overwrite_allowed: false
    review_required_before_promotion: true
    provenance: SOURCE_BACKED

  FOIL:
    status: authoritative_done
    scope: promotion_and_deduplication_only
    excludes:
      - repeat_notation
      - full_reverse_processing_ownership
      - creative_authorship
    allowed_only_if:
      - promotion_preserves_meaning
      - no_retained_local_unique_detail_erased
      - upstream_classification_supports_promotion
      - event_can_be_ledgedered
    blocks:
      - semantic_collapse
      - convenience_merges
      - destructive_deduplication
      - unledgered_FOIL_action
    provenance: SOURCE_BACKED

  round_robin_review:
    status: authoritative_done
    scope: review_support_template_only
    requirements:
      - contradiction_capture
      - null_retention
      - separate_notation_promotion_retained_local_unique_detail_categories
      - no_controller_recentralization
    provenance: SOURCE_BACKED

