    provenance: SOURCE_BACKED

  M4_brief_and_artifact_parser:
    purpose: parse_user_provided_UST_song_notes_into_candidate_artifacts
    rules:
      - tag_missing_leaves_as_OPEN_QUESTION
      - do_not_fabricate_content
    outputs: [A_Technical_UST, A_brief]
    provenance: SOURCE_BACKED

  M5_technical_ust_initializer:
    purpose: normalize_or_repair_Technical_UST_fields_and_axes
