    provenance: SOURCE_BACKED

  M7_SEG_and_G_card_evaluator:
    purpose: score_excellence_and_emit_decision_artifact
    pass_threshold: 97.5
    outputs: [SEG_result, G_CARD]
    provenance: SOURCE_BACKED

  M8_revision_loop_orchestrator:
