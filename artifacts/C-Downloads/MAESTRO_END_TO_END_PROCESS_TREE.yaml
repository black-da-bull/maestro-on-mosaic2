    provenance: SOURCE_BACKED

  M6_SME_round_robin_orchestrator:
    purpose: apply_persona_SME_lenses_to_evaluate_nodes
    review_artifact: round_robin_notes
    must_preserve:
      - claims
      - objections
      - contradiction_capture
      - nulls_to_preserve
      - notation_candidates
      - promotion_candidates
      - retained_local_unique_detail
