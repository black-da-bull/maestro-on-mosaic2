execution_sequence:
  graph_rule:
    claim: validation_must_be_edge_based_not_artifact_only_edges_reconstructed_before_nodes
    provenance: SOURCE_BACKED

  M0_session_init_and_state_load:
    purpose: load_current_worklog_inputs_initialize_state_containers
    inputs: [conversation_worklog, pasted_specs, attached_artifacts]
    outputs: [S_raw_corpus, S_rule_registry, S_change_request_log, S_session_ledger]
    provenance: SOURCE_BACKED

  M1_change_request_handler:
    purpose: detect_and_apply_CRs_as_governance_events_with_precedence_and_lineage
    outputs: [S_rule_registry, S_change_request_log]
    rules:
      - newer_CR_can_supersede_older_rules_with_version_tags
      - fork_conflicts_with_conflict_notes
    provenance: SOURCE_BACKED

  M2_RECA_snapshot_builder:
    purpose: build_requirements_environment_constraints_assets_snapshot
    outputs: [RECA_snapshot]
    provenance: SOURCE_BACKED

  M3_operating_env_snapshot_builder:
    purpose: declare_actual_operating_state_OS_lines_agents_tools_validators_assumed_defaults
