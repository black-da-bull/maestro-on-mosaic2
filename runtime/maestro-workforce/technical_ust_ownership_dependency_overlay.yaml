meta:
  artifact_name: technical_ust_ownership_dependency_overlay.yaml
  artifact_type: runtime_ownership_dependency_overlay
  version: v5_c.p0.2
  status: operator_authorized_materialized
  date: 2026-09-07
  parent_runtime: runtime/maestro-workforce/canonical_13_employee_instances.yaml
  technical_ust_source: project:template.technical.ust.yaml
  rule: bind only what source evidence supports; unresolved ownership remains explicit and blocks autonomous write authority

governing_invariants:
  - Technical UST remains the canonical song-state substrate.
  - Controller authority is not widened by this overlay.
  - Read access, review participation, and dependency participation do not imply write ownership.
  - Governance/evaluation workers do not become creative leaf owners by proximity.
  - A worker may write only an address explicitly bound here or later promoted by operator-authorized evidence.
  - Unresolved primary ownership is a runtime signal, not permission for orchestration to fill the gap.

