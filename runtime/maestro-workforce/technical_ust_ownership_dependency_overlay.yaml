blocking_gaps:
  - id: P0.2.GAP.THY.GENERAL
    severity: blocking_for_zero_touch
    scope: [THY.K1, THY.K2, THY.K3_except_S4, THY.K4.S1, THY.K4.S4]
    reason: no current worker instance has source-supported general harmonic/theory ownership
    required_resolution: operator-authorized evidence mapping or creation/promotion of a lawful current theory SME; do not infer from role names
  - id: P0.2.GAP.VOC.HARMONY_ASSIGNMENT
    severity: blocking_for_unattended_leaf_write
    scope: [VOC.K3]
    reason: current evidence supports Vanessa for delivery but not sole ownership of performer/harmony assignment
  - id: P0.2.GAP.TIM.PRIMARY
    severity: nonblocking_for_review_blocking_for_unattended_leaf_write
    scope: [TIM]
    reason: Metro and Analog Confessor both have supported lanes; no evidence selects a universal primary owner
  - id: P0.2.GAP.PER.PRIMARY
    severity: nonblocking_for_review_blocking_for_unattended_leaf_write
    scope: [PER]
    reason: Vanessa, Dave, and Alan own different performance dimensions; no evidence supports collapsing them to one primary owner

