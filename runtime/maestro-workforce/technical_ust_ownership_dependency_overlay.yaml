runtime_policy:
  autonomous_write_allowed_only_if:
    - address has an explicit primary_owner in this overlay
    - worker runtime writable-zone and non-authority checks pass
    - no applicable blocking gap covers the address
    - crossstream required reviewers are scheduled before final acceptance
  unresolved_behavior: abstain_and_route
  dependency_change_behavior: reopen_only_impacted_addresses_and_dependents
  no_full_stack_rerun_by_default: true
