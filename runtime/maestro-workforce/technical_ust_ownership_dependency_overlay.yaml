      relation: section_arrangement_to_vocal_priority
      owner_from: MAESTRO.AUDIO.08.ALAN
      reviewer_to: MAESTRO.AUDIO.10.VANESSA
    - from: MAP
      to: POST
      relation: arrangement_before_mix
      owner_from: MAESTRO.AUDIO.08.ALAN
      reviewer_to: MAESTRO.AUDIO.13.ELDRIK
