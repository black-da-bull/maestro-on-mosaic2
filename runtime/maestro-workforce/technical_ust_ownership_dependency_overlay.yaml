governing_invariants:
  - Technical UST remains the canonical song-state substrate.
  - Controller authority is not widened by this overlay.
  - Read access, review participation, and dependency participation do not imply write ownership.
  - Governance/evaluation workers do not become creative leaf owners by proximity.
  - A worker may write only an address explicitly bound here and allowed by its worker contract.
  - Crossstream objections preserve lawful peer authority and never silently transfer ownership.
  - Locked lyrics remain immutable unless operator-authorized modification is explicit.

