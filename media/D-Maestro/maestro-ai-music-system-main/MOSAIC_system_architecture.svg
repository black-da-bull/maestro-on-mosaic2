  <text class="th" x="535" y="106" text-anchor="middle" dominant-baseline="central">Genre shift</text>
  <text class="ts" x="535" y="120" text-anchor="middle" dominant-baseline="central">Macro reframe → cascade</text>
</g>

<!-- Arrow down -->
<line x1="340" y1="140" x2="340" y2="162" class="arr" marker-end="url(#arrow)"/>

<!-- TIER 2: ORCHESTRATOR -->
