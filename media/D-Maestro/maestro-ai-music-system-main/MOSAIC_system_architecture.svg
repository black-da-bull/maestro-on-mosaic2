<svg width="100%" viewBox="0 0 680 920" role="img" xmlns="http://www.w3.org/2000/svg">
<title>MOSAIC System Architecture</title>
<desc>Modular Orchestrated Songcraft and AI Composition Intelligence — v1.0 layered architecture diagram showing five tiers from user input through orchestrator routing, expert modules, synthesis engine, and output template generation for Suno v4.5</desc>

<style>
  text { font-family: sans-serif; fill: #1a1a1a; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; fill: #444; }
  .t  { font-size: 14px; font-weight: 400; }

  /* c-gray */
  .c-gray rect, .c-gray ellipse, .c-gray circle { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-gray .th, .c-gray .t { fill: #2C2C2A; }
  .c-gray .ts { fill: #444441; }

  /* c-purple */
  .c-purple rect, .c-purple ellipse, .c-purple circle { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple .th, .c-purple .t { fill: #26215C; }
  .c-purple .ts { fill: #3C3489; }

  /* c-teal */
  .c-teal rect, .c-teal ellipse, .c-teal circle { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal .th, .c-teal .t { fill: #04342C; }
  .c-teal .ts { fill: #085041; }

  /* c-blue */
  .c-blue rect, .c-blue ellipse, .c-blue circle { fill: #E6F1FB; stroke: #185FA5; }
  .c-blue .th, .c-blue .t { fill: #042C53; }
  .c-blue .ts { fill: #0C447C; }

  /* c-amber */
  .c-amber rect, .c-amber ellipse, .c-amber circle { fill: #FAEEDA; stroke: #854F0B; }
  .c-amber .th, .c-amber .t { fill: #412402; }
  .c-amber .ts { fill: #633806; }

  /* c-coral */
  .c-coral rect, .c-coral ellipse, .c-coral circle { fill: #FAECE7; stroke: #993C1D; }
  .c-coral .th, .c-coral .t { fill: #4A1B0C; }
  .c-coral .ts { fill: #712B13; }

  /* box (neutral) */
  .box { fill: #F5F4F0; stroke: #B4B2A9; stroke-width: 0.5px; }

  /* arr line */
  .arr { stroke: #888780; stroke-width: 1.5px; fill: none; }

  @media (prefers-color-scheme: dark) {
    text { fill: #E8E6DF; }
    .ts  { fill: #B4B2A9; }

    .c-gray rect, .c-gray ellipse, .c-gray circle { fill: #444441; stroke: #D3D1C7; }
    .c-gray .th, .c-gray .t { fill: #F1EFE8; }
    .c-gray .ts { fill: #D3D1C7; }

    .c-purple rect, .c-purple ellipse, .c-purple circle { fill: #3C3489; stroke: #CECBF6; }
    .c-purple .th, .c-purple .t { fill: #EEEDFE; }
    .c-purple .ts { fill: #CECBF6; }

    .c-teal rect, .c-teal ellipse, .c-teal circle { fill: #085041; stroke: #9FE1CB; }
    .c-teal .th, .c-teal .t { fill: #E1F5EE; }
    .c-teal .ts { fill: #9FE1CB; }

    .c-blue rect, .c-blue ellipse, .c-blue circle { fill: #0C447C; stroke: #B5D4F4; }
    .c-blue .th, .c-blue .t { fill: #E6F1FB; }
    .c-blue .ts { fill: #B5D4F4; }

    .c-amber rect, .c-amber ellipse, .c-amber circle { fill: #633806; stroke: #FAC775; }
    .c-amber .th, .c-amber .t { fill: #FAEEDA; }
    .c-amber .ts { fill: #FAC775; }

    .c-coral rect, .c-coral ellipse, .c-coral circle { fill: #712B13; stroke: #F5C4B3; }
    .c-coral .th, .c-coral .t { fill: #FAECE7; }
    .c-coral .ts { fill: #F5C4B3; }

    .box { fill: #2C2C2A; stroke: #5F5E5A; }
    .arr { stroke: #888780; }
  }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Title -->
<text class="th" x="340" y="32" text-anchor="middle">MOSAIC — Modular Orchestrated Songcraft &amp; AI Composition Intelligence</text>
<text class="ts" x="340" y="50" text-anchor="middle">v1.0 · open-source · peer-reviewable · auditable by design</text>

