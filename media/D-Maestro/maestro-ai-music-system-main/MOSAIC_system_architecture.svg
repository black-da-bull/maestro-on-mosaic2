  <text class="th" x="340" y="183" text-anchor="middle" dominant-baseline="central">ORCHESTRATOR</text>
  <text class="ts" x="340" y="202" text-anchor="middle" dominant-baseline="central">Routes by: complexity · ambiguity · modality · outcome type · character budget</text>
</g>

