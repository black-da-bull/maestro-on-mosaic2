name: Audio Analysis Worker v0.6

on:
  pull_request:
    paths:
      - 'runtime/maestro-audio-worker/**'
      - 'runtime/maestro-workforce/audio_analysis_gateway.py'
      - '.github/workflows/audio-analysis-worker-v0.6.yml'
      - '_PROVENANCE/experiments/2026-09-14/**'
  push:
    branches:
      - development/audio-analysis-worker-v0.6-2026-09-14
      - main
    paths:
      - 'runtime/maestro-audio-worker/**'
      - 'runtime/maestro-workforce/audio_analysis_gateway.py'
      - '.github/workflows/audio-analysis-worker-v0.6.yml'
      - '_PROVENANCE/experiments/2026-09-14/**'

jobs:
  core-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install worker core
        run: python -m pip install -r runtime/maestro-audio-worker/requirements-core.txt
      - name: Compile worker
        run: python -m compileall -q runtime/maestro-audio-worker
      - name: Run worker core contract
        working-directory: runtime/maestro-audio-worker
        run: PYTHONPATH=. python tests/test_worker_core.py
      - name: Run deterministic calibration contract
        working-directory: runtime/maestro-audio-worker
        run: PYTHONPATH=. python tests/test_calibration.py
      - name: Run authenticated gateway-worker protocol E2E
        working-directory: runtime/maestro-audio-worker
        run: PYTHONPATH=. python tests/test_gateway_e2e.py
      - name: Build core container
        run: docker build -t maestro-audio-worker:ci runtime/maestro-audio-worker

  beat-this-cpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch
        run: python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - name: Install Beat This worker profile
        run: python -m pip install -r runtime/maestro-audio-worker/requirements-beat-this.txt
      - name: Probe CPU/checkpoint execution
        working-directory: runtime/maestro-audio-worker
        run: PYTHONPATH=. python tests/beat_this_cpu_smoke.py
