name: Audio Analysis Worker v0.6

on:
  pull_request:
    paths:
      - 'runtime/maestro-audio-worker/**'
      - 'runtime/maestro-workforce/audio_analysis_gateway.py'
      - '.github/workflows/audio-analysis-worker-v0.6.yml'
      - '_PROVENANCE/experiments/2026-09-14/**'
  push:
    branches:
      - development/audio-analysis-worker-v0.6-2026-09-14
      - development/audio-model-profiles-v0.6-2026-09-14
      - development/audio-calibration-v0.7-2026-09-14
      - main
    paths:
      - 'runtime/maestro-audio-worker/**'
      - 'runtime/maestro-workforce/audio_analysis_gateway.py'
      - '.github/workflows/audio-analysis-worker-v0.6.yml'
      - '_PROVENANCE/experiments/2026-09-14/**'

jobs:
  core-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install worker core
        run: python -m pip install -r runtime/maestro-audio-worker/requirements-core.txt
      - name: Compile worker and profile bridges
        run: python -m compileall -q runtime/maestro-audio-worker
      - name: Run worker core contract
        working-directory: runtime/maestro-audio-worker
        run: PYTHONPATH=. python tests/test_worker_core.py
      - name: Run deterministic calibration contract
        working-directory: runtime/maestro-audio-worker
        run: PYTHONPATH=. python tests/test_calibration.py
      - name: Run calibration manifest authority contract
        working-directory: runtime/maestro-audio-worker
        run: PYTHONPATH=. python tests/test_calibration_manifest.py
      - name: Run trusted immutable artifact synchronization contract
        working-directory: runtime/maestro-audio-worker
        run: PYTHONPATH=. python tests/test_artifact_sync.py
      - name: Run isolated model profile deployment contract
        working-directory: runtime/maestro-audio-worker
        run: PYTHONPATH=. python tests/test_profile_contracts.py
      - name: Run authenticated worker HTTP protocol E2E
        working-directory: runtime/maestro-audio-worker
        run: PYTHONPATH=. python tests/test_gateway_e2e.py
      - name: Run real Maestro workforce gateway to worker E2E
        working-directory: runtime/maestro-audio-worker
        run: PYTHONPATH=. python tests/test_maestro_gateway_worker_e2e.py
      - name: Build core container
        run: docker build -t maestro-audio-worker:ci runtime/maestro-audio-worker

  beat-this-cpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch
        run: python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - name: Install Beat This worker profile
        run: python -m pip install -r runtime/maestro-audio-worker/requirements-beat-this.txt
      - name: Probe CPU/checkpoint execution and identity
        working-directory: runtime/maestro-audio-worker
        run: PYTHONPATH=. python tests/beat_this_cpu_smoke.py
      - name: Stage portable Beat This bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import importlib.metadata
          import json
          import shutil
          import sys
          import beat_this
          import torch

          out = Path('/tmp/maestro-beat-this-bundle')
          out.mkdir(parents=True, exist_ok=True)
          package_root = Path(beat_this.__file__).resolve().parent
          shutil.copytree(package_root, out / 'beat_this', dirs_exist_ok=True)

          checkpoint = Path(torch.hub.get_dir()) / 'checkpoints' / 'beat_this-small0.ckpt'
          if not checkpoint.is_file():
              raise SystemExit(f'expected checkpoint missing: {checkpoint}')
          shutil.copy2(checkpoint, out / checkpoint.name)
          digest = hashlib.sha256(checkpoint.read_bytes()).hexdigest()

          metadata = {
              'schema': 'maestro.model-portable-bundle.v0.7',
              'model_family': 'CPJKU/beat_this',
              'package': 'beat-this',
              'package_version': importlib.metadata.version('beat-this'),
              'checkpoint_name': checkpoint.name,
              'checkpoint_sha256': digest,
              'python': sys.version.split()[0],
              'torch': torch.__version__,
              'purpose': 'operator-private-artifact calibration; not redistribution authority',
          }
          (out / 'bundle.json').write_text(json.dumps(metadata, indent=2), encoding='utf-8')
          PY
          python -m pip freeze > /tmp/maestro-beat-this-bundle/pip-freeze.txt
      - name: Upload portable Beat This bundle
        uses: actions/upload-artifact@v4
        with:
          name: maestro-beat-this-small0-cpu-bundle
          path: /tmp/maestro-beat-this-bundle
          if-no-files-found: error
          retention-days: 3
